<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Site discret tant que les avis (DRCI, DPO) ne sont pas obtenus : non référencé par les moteurs de recherche. -->
<meta name="robots" content="noindex, nofollow">
<title>Études cliniques ouvertes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bandeau-test" class="bandeau-test" hidden></div>
  <header class="entete">
    <div class="page">
      <h1 id="titre">Études cliniques</h1>
      <p id="sous-titre"></p>
    </div>
  </header>
  <main class="page">
    <p id="etat" class="note" aria-live="polite">Chargement…</p>
    <nav class="entrees" aria-label="Choisir son espace">
      <a class="entree" id="entree-medecin" href="innovaction/">
        <span class="entree-titre">Je suis médecin</span>
        <span class="entree-module" id="nom-pro"></span>
        <span class="entree-texte" id="texte-pro"></span>
      </a>
      <div class="entree inactive" id="entree-patient" aria-disabled="true">
        <span class="entree-titre">Je suis patient</span>
        <span class="entree-module" id="nom-patient"></span>
        <span class="entree-texte">Bientôt disponible.</span>
      </div>
    </nav>
  </main>
  <footer class="page pied">
    <p id="avertissement"></p>
    <p id="genere" class="note"></p>
  </footer>
  <script src="js/accueil.js"></script>
</body>
</html>
