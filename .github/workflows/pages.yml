# Déploie le site public (dossier site/ uniquement) sur GitHub Pages.
# Se déclenche à chaque modification de site/ sur la branche principale (par exemple quand le
# Publieur envoie un nouveau protocoles.json), ou à la main (onglet Actions).
# SÉCURITÉ : les tests automatiques passent AVANT le déploiement ; s'ils échouent (par exemple un
# champ interne dans protocoles.json), rien n'est mis en ligne.
name: Site public (GitHub Pages)

on:
  push:
    branches: [main]
    # site/ (nouvelles données ou pages), et aussi les tests et ce fichier : un correctif des tests
    # relance ainsi la mise en ligne, sans manipulation.
    paths: ['site/**', 'tests/**', 'src/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
